kotlin.code.style=official

# Rider SDK는 IC보다 무겁다.
org.gradle.jvmargs=-Xmx4096m

# IntelliJ Platform이 kotlin-stdlib를 제공하므로 플러그인 ZIP에 중복 번들하지 않는다.
kotlin.stdlib.default.dependency=false

# 플러그인 버전 단일 출처.
# build.gradle.kts / version.sh(모든 셸 스크립트) 가 이 값을 읽는다.
# 버전을 올릴 때는 이 줄만 수정하면 된다.
pluginVersion=1.0.1
